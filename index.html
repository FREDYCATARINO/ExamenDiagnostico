<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="contenedor">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">
                Brand
            </div>

            <nav class="menu">

                <a href="#">Inicio</a>

                <a href="#" class="activo">
                    Productos
                </a>

                <a href="#">
                    Nosotros
                </a>

            </nav>

            <div class="carrito">
                <i class="bi bi-cart-fill"></i>
            </div>

        </header>


        <!-- ================= CONTENIDO ================= -->

        <section class="productos">

            <h1>
                Nuestros productos
            </h1>


            <!-- ================= BUSCADOR ================= -->

            <div class="buscador">

                <div class="input-busqueda">

                    <i class="bi bi-search"></i>

                    <input
                        type="text"
                        id="buscador"
                        placeholder="Buscar productos...">

                </div>

                <button id="btnFiltrar">
                    Filtrar
                </button>

            </div>


            <!-- ================= PRODUCTOS ================= -->

            <div class="row productos-grid" id="listaProductos">


                <!-- PRODUCTO 1 -->

                <div class="col-12 col-sm-6 producto-item">

                    <article class="producto-card">

                        <div class="producto-imagen">

                            <img
                              src="public/img/OIP.webp"
                                alt="Audífonos Inalámbricos">

                        </div>

                        <div class="producto-datos">

                            <h2>
                                Audífonos Inalámbricos
                            </h2>

                            <p class="precio">
                                $59.99
                            </p>

                            <div class="estrellas">

                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>

                            </div>

                        </div>

                    </article>

                </div>


                <!-- PRODUCTO 2 -->

                <div class="col-12 col-sm-6 producto-item">

                    <article class="producto-card">

                        <div class="producto-imagen">

                            <img
                                src="public/img/OIP (1).webp"
                                alt="Smartwatch Pro">

                        </div>

                        <div class="producto-datos">

                            <h2>
                                Smartwatch Pro
                            </h2>

                            <p class="precio">
                                $89.99
                            </p>

                            <div class="estrellas">

                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>

                            </div>

                        </div>

                    </article>

                </div>


                <!-- PRODUCTO 3 -->

                <div class="col-12 col-sm-6 producto-item">

                    <article class="producto-card">

                        <div class="producto-imagen">

                            <img
                                src="public/img/OIP.webp"

                                alt="Cámara Digital">

                        </div>

                        <div class="producto-datos">

                            <h2>
                                Cámara Digital
                            </h2>

                            <p class="precio">
                                $199.99
                            </p>

                            <div class="estrellas">

                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>

                            </div>

                        </div>

                    </article>

                </div>


                <!-- PRODUCTO 4 -->

                <div class="col-12 col-sm-6 producto-item">

                    <article class="producto-card">

                        <div class="producto-imagen">

                            <img
                                src="public/img/OIP (1).webp"
                                alt="Mochila Urbana">

                        </div>

                        <div class="producto-datos">

                            <h2>
                                Mochila Urbana
                            </h2>

                            <p class="precio">
                                $39.99
                            </p>

                            <div class="estrellas">

                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>
                                <i class="bi bi-star-fill"></i>

                            </div>

                        </div>

                    </article>

                </div>

            </div>


            <!-- ================= PAGINACIÓN ================= -->

            <div class="paginacion">

                <button class="pagina activa">
                    1
                </button>

                <button class="pagina">
                    2
                </button>

                <button class="pagina">
                    3
                </button>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
